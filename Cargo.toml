[package]
name = "fatrocu"
version = "3.1.0"
edition = "2024"
description = "Native Windows document review and export"
license = "MIT"

[dependencies]
fatrocu-cli = { path = "../fatrocu-cli" }
eframe = "=0.37.0"
anyhow = "1"
serde_json = "1"
rfd = "0.15"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
tempfile = "3"
