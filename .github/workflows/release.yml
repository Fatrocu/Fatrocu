name: Build unsigned Windows beta candidate
on:
  workflow_dispatch:
  push:
    branches: ['codex/release-3.1.0-beta.1']
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: Fatrocu
      - name: Read dependency revisions
        shell: pwsh
        run: |
          "CORE_REVISION=$(Get-Content Fatrocu/core-revision.txt)" | Out-File -FilePath $env:GITHUB_ENV -Append
          "SERVER_REVISION=$(Get-Content Fatrocu/server-revision.txt)" | Out-File -FilePath $env:GITHUB_ENV -Append
      - uses: actions/checkout@v4
        with:
          repository: Fatrocu/fatrocu-cli
          ref: ${{ env.CORE_REVISION }}
          path: fatrocu-cli
      - uses: actions/checkout@v4
        with:
          repository: Fatrocu/fatrocu-server
          ref: ${{ env.SERVER_REVISION }}
          path: fatrocu-server
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --locked --release --manifest-path fatrocu-cli/Cargo.toml
      - run: cargo build --locked --release --manifest-path fatrocu-server/Cargo.toml
      - run: cargo build --locked --release --manifest-path Fatrocu/Cargo.toml
      - name: Package unsigned Windows beta with pinned companions
        run: python fatrocu-cli/scripts/package-beta.py --product desktop --root Fatrocu --output "${{ runner.temp }}/beta-dist"
      - uses: actions/upload-artifact@v4
        with:
          name: beta-fatrocu-desktop-windows
          path: ${{ runner.temp }}/beta-dist/*
          if-no-files-found: error
# This is an unsigned manual-test beta, never an authenticated production update.
