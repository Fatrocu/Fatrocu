name: Build Windows release candidate
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: Fatrocu
      - name: Read dependency revisions
        shell: pwsh
        run: |
          "CORE_REVISION=$(Get-Content Fatrocu/core-revision.txt)" | Out-File -FilePath $env:GITHUB_ENV -Append
          "SERVER_REVISION=$(Get-Content Fatrocu/server-revision.txt)" | Out-File -FilePath $env:GITHUB_ENV -Append
      - uses: actions/checkout@v4
        with:
          repository: Fatrocu/fatrocu-cli
          ref: ${{ env.CORE_REVISION }}
          path: fatrocu-cli
      - uses: actions/checkout@v4
        with:
          repository: Fatrocu/fatrocu-server
          ref: ${{ env.SERVER_REVISION }}
          path: fatrocu-server
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --locked --release --manifest-path fatrocu-cli/Cargo.toml
      - run: cargo build --locked --release --manifest-path fatrocu-server/Cargo.toml
      - run: cargo build --locked --release --manifest-path Fatrocu/Cargo.toml
      - uses: actions/upload-artifact@v4
        with:
          name: unsigned-windows-candidate
          path: |
            Fatrocu/target/release/fatrocu.exe
            fatrocu-cli/target/release/fatrocu-updater.exe
            fatrocu-server/target/release/fatrocu-server.exe
# Publisher signing, private accuracy gates and stable release publication remain manual.
